<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaereve — Under Maintenance</title>
    <meta
      name="description"
      content="Chaereve is getting an upgrade and expects to reopen in about seven days. Your requests, votes, and wallet balance are safe."
    />
    <!-- Keep the temporary maintenance page out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="color-scheme" content="dark" />

    <!-- Embedded favicon keeps this page independent from the main app. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234d40f0'/%3E%3Cpath d='M40 15v23.6a6.5 6.5 0 1 1-4-6V22.6L24.6 25.4v17.2a6.5 6.5 0 1 1-4-6V22.4L40 15z' fill='white'/%3E%3C/svg%3E"
    />

    <!-- The same typefaces used by the main Chaereve app. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Archivo:wght@700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chaereve" />
    <meta property="og:title" content="Chaereve — Under Maintenance" />
    <meta
      property="og:description"
      content="Chaereve is getting an upgrade and expects to reopen in about seven days. Your requests, votes, and wallet balance are safe."
    />
    <meta property="og:image" content="https://chaereve.pages.dev/logo-192.png" />

    <!-- Paint the dark background before the application bundle loads. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0a0c10;
        color: #e9edf3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          font-family: system-ui, sans-serif;
          text-align: center;
          padding: 24px;
        "
      >
        <strong style="font-size: 20px">Chaereve is under maintenance</strong>
        <span style="color: #9aa4b2">
          We are making Chaereve better and will be back soon.
        </span>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
