<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaereve</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0d10; /* Màu tối nguyên bản của chaereve.pages.dev */
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .maintenance-wrapper {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .brand-logo span {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #9ca3af;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="maintenance-wrapper">
        <div class="brand-logo">Chaereve<span>.</span></div>
        <p>Hệ thống hiện đang được bảo trì. Vui lòng quay lại sau.</p>
        <a href="/" class="btn">Tải lại trang</a>
    </div>

</body>
</html>
