<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Đang bảo trì | Chaereve</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 520px; }
    .icon { font-size: 72px; margin-bottom: 20px; animation: spin 6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #fff; }
    p { line-height: 1.6; color: #94a3b8; margin-bottom: 8px; }
    .badge {
      display: inline-block; margin-top: 24px; padding: 8px 18px;
      border: 1px solid #334155; border-radius: 999px;
      font-size: 0.85rem; color: #cbd5e1;
    }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f59e0b; margin-right:8px; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">⚙️</div>
    <h1>Website đang bảo trì</h1>
    <p>Chúng tôi đang nâng cấp hệ thống để mang lại trải nghiệm tốt hơn.</p>
    <p>Vui lòng quay lại sau ít phút. Cảm ơn bạn đã kiên nhẫn!</p>
    <div class="badge"><span class="dot"></span>Dự kiến hoàn tất sớm</div>
  </div>
</body>
</html>
