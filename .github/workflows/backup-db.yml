# =========================================================
# SAO LƯU DATABASE — mỗi ngày một lần, miễn phí, không cần dịch vụ nào
# ---------------------------------------------------------
# Gói free của Supabase KHÔNG có backup tự động: dữ liệu thật của app (request,
# vote, đơn hàng, lịch sử vòng quay) chỉ nằm ở một chỗ. Workflow này là bản
# sao duy nhất — và nó KHÔNG chỉ copy file ra: sau khi dump, nó đổ bản dump
# vào một Postgres sạch trong chính máy ảo rồi so dấu vân tay (số dòng từng
# bảng, function, policy, trigger). Lệch một dòng là job đỏ.
#
# Cần đặt 1 secret:  SUPABASE_DB_URL  (chuỗi Session pooler, cổng 5432)
# Tuỳ chọn, 4 secret: R2_BUCKET · R2_ACCOUNT_ID · R2_ACCESS_KEY_ID ·
#                     R2_SECRET_ACCESS_KEY  → giữ bản sao lâu hơn 30 ngày
# Cách lấy từng thứ: HUONG-DAN.md, mục "Sao lưu database".
#
# ⚠️ Cron chỉ chạy trên NHÁNH MẶC ĐỊNH. Muốn nó tự chạy hằng ngày thì phải
#    merge vào main; còn chạy tay (Run workflow) thì chạy được từ nhánh nào
#    cũng được — dùng đúng cách đó để thử lần đầu.
#
# Giờ chạy 19:00 UTC = 02:00 giờ VN: lúc kênh vắng người nhất, và pg_dump
# không tranh chấp với ai.
# =========================================================
name: Sao lưu database

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    # Tạm bật cho tiền kiểm rollout payment 2026-11-15. Token sandbox không có
    # actions:write nên push là đường chạy backup đã duyệt. Script CHỈ ĐỌC với
    # production; sẽ tắt lại trigger này trước khi apply để không dump chồng apply.
    branches:
      - 'arena/c039d143-color-coded-lyrics-cf-new'

# Hai lượt chồng nhau (bấm tay đúng lúc cron nổ) thì bản sau xếp hàng, không
# chạy song song: hai pg_dump cùng lúc chỉ tốn tài nguyên vô ích.
concurrency:
  group: backup-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tạm thời: chuyển bản backup ĐÃ MÃ HOÁ bằng public key sang nhánh phiên để
    # sandbox tải qua git (artifact storage nằm ngoài allowlist), rồi upload Drive.
    # Không có private key trong repo/workflow; file transport sẽ gỡ trước merge.
    permissions:
      contents: write

    # Postgres sạch để THỬ PHỤC HỒI. Miễn phí: container chạy trong máy ảo
    # của runner, không phải một dịch vụ ngoài nào.
    services:
      verify:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      # Dùng luôn image postgres:17 đã có ở job service thay vì cài client qua
      # PGDG. Cách cũ phụ thuộc vào key/repository của Ubuntu runner và đã làm
      # job dừng trước bước dump; database/password chưa hề được kiểm tra.
      # Image này có sẵn pg_dump, psql và pg_restore cùng major version với
      # Supabase, còn `--network host` cho phép container verify chạm vào
      # Postgres service đang publish ở localhost:5432.
      - name: Kiểm tra PostgreSQL client 17
        run: docker run --rm postgres:17 pg_dump --version

      - name: Dump + dấu vân tay
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm --network host \
            -e SUPABASE_DB_URL \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            postgres:17 \
            bash scripts/backup-db.sh

      - name: Thử phục hồi vào Postgres sạch
        run: |
          docker run --rm --network host \
            -e VERIFY_DB_URL=postgres://postgres:verify@127.0.0.1:5432/verify \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            postgres:17 \
            bash scripts/verify-backup.sh

      # Transport tạm cho rollout payment: chỉ chạy SAU khi restore thử khớp.
      # CMS dùng RSA-4096 recipient + AES-256; private key chỉ ở sandbox ignored.
      # Commit chỉ chứa ciphertext, không bao giờ dump/auth-users dạng rõ.
      - name: Chuyển bản backup mã hoá tới phiên đang duyệt
        if: success() && github.ref_name == 'arena/c039d143-color-coded-lyrics-cf-new'
        run: |
          set -euo pipefail
          test -s backup/manifest.txt
          test -s backup/fingerprint-restored.txt
          cmp backup/fingerprint.txt backup/fingerprint-restored.txt
          tar -czf /tmp/chaereve-verified-backup.tar.gz -C backup .
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in /tmp/chaereve-verified-backup.tar.gz \
            -out .github/rollout-backup.cms \
            .github/rollout-backup-transport.crt
          sha256sum .github/rollout-backup.cms > .github/rollout-backup.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/rollout-backup.cms .github/rollout-backup.sha256
          git commit -m 'Transfer encrypted verified backup for approved rollout [skip ci]'
          git push origin HEAD:arena/c039d143-color-coded-lyrics-cf-new
          echo '::notice title=backup transport::Đã push ciphertext đã mã hoá; chưa có bản rõ trong Git'

      # Kênh đọc kết quả từ sandbox: log/artifact của runner không tải được (host
      # lưu trữ ngoài allowlist) nên đưa manifest + kết quả so dấu vân tay ra
      # annotation — đọc được qua `gh run view` hoặc trên trang check-run.
      # Manifest chỉ chứa sha256 + số liệu, KHÔNG có chuỗi kết nối.
      - name: Xuất kết quả backup ra annotation
        if: always()
        run: |
          node -e '
          const fs = require("fs")
          const read = p => { try { return fs.readFileSync(p, "utf8") } catch { return "" } }
          const manifest = read("backup/manifest.txt").trim()
          const src = read("backup/fingerprint.txt")
          const restored = read("backup/fingerprint-restored.txt")
          const lines = src ? src.trim().split("\n").length : 0
          const matched = !!restored && src === restored
          const msg = s => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A")
          const title = s => msg(s).replace(/:/g, "%3A").replace(/,/g, "%2C")
          const head = matched
            ? `ĐÃ XÁC MINH — dấu vân tay khớp hoàn toàn ${lines} dòng (bản phục hồi thử = nguồn)`
            : "CHƯA XÁC MINH — bản phục hồi lệch nguồn hoặc bước verify chưa xong; job phải ĐỎ, đừng dựa vào dump này"
          console.log(`::notice title=${title("backup production — " + head)}::${msg(manifest || "(không đọc được manifest)")}`)
          '

      - name: (tuỳ chọn) Đẩy lên Cloudflare R2
        if: success()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          bash scripts/push-to-r2.sh | tee /tmp/backup-r2.txt

      # Chỉ công bố trạng thái lưu trữ, không công bố secret hay dữ liệu người dùng.
      # Một lượt restore thử thành công vẫn chưa đủ nếu dump bị xoá cùng runner.
      - name: Đối chiếu nơi giữ bản backup
        if: always()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          node -e '
          const fs = require("fs")
          let r2 = ""
          try { r2 = fs.readFileSync("/tmp/backup-r2.txt", "utf8") } catch {}
          const stored = !!process.env.R2_BUCKET && r2.includes("[r2] xong.")
          const encrypted = !!process.env.BACKUP_PASSPHRASE && fs.existsSync("backup/db-backup.tar.gz.gpg")
          console.log(`::notice title=backup retention::R2 copy=${stored}; encrypted artifact=${encrypted}; durable=${stored || encrypted}`)
          '

      # KHÔNG BAO GIỜ đẩy bản dump thô (`*.dump`, `auth-users.sql` chứa email OAuth
      # và ghi chú riêng tư) lên GitHub Actions artifact vì trên repo công khai bất
      # kỳ tài khoản GitHub nào cũng tải được artifact. Chỉ đóng gói bản mã hoá
      # AES-256 khi chủ dự án khai báo secret `BACKUP_PASSPHRASE`; còn metadata chẩn
      # đoán (`manifest.txt`, `fingerprint*.txt`, `fingerprint.diff`) vẫn giữ nguyên.
      - name: (tuỳ chọn) Mã hoá bản dump trước khi lưu artifact
        if: always()
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -n "${BACKUP_PASSPHRASE:-}" ] && [ -d backup ] && compgen -G "backup/*.dump" > /dev/null; then
            tar -czf - -C backup . | gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-fd 0 -o backup/db-backup.tar.gz.gpg <<< "$BACKUP_PASSPHRASE"
          fi

      # if: always() — khi verify hỏng, manifest + fingerprint.diff vẫn xem được
      # để biết lệch ở bảng/policy nào mà không làm rò dữ liệu người dùng.
      - name: Lưu artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: |
            backup/manifest.txt
            backup/fingerprint*.txt
            backup/fingerprint.diff
            backup/*.gpg
            !backup/*.dump
            !backup/*.sql
          retention-days: 30
          # Nếu dump fail thì giữ lỗi gốc ở bước dump; đừng ghi đè nó bằng
          # một lỗi artifact thứ cấp "No files were found".
          if-no-files-found: warn

      # GitHub đã tự gửi email khi workflow đỏ; dòng này để log nói thẳng
      # việc cần làm thay vì chỉ báo "exit code 1".
      - name: Nhắc khi hỏng
        if: failure()
        run: |
          echo "::error::Sao lưu KHÔNG thành công. Kiểm tra: (1) secret SUPABASE_DB_URL, (2) project Supabase có đang ngủ vì gói free không, (3) chuỗi kết nối phải là Session pooler cổng 5432."
