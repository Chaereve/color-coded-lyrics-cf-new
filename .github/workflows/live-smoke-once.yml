# TỆM — chạy MỘT lần rồi xoá khỏi nhánh.
#
# Vì sao tồn tại: `gh workflow run` (workflow_dispatch) trả 403
# "Resource not accessible by integration" — token GitHub của phiên Arena không
# có quyền `actions: write`, nên không dispatch được
# quiz-retirement-browser.yml với input live_url. Workflow này chỉ là cái vỏ
# kích đúng script smoke đã có (tools/browserSmoke.mjs) qua push event, chạy
# CHỈ-ĐỌC trên site thật https://chaereve.pages.dev.
#
# Đây KHÔNG phải thay thế quiz-retirement-browser.yml: file này bị xoá ngay sau
# khi lấy kết quả, không đi vào main.
name: Live smoke (tạm, một lần) — chaereve.pages.dev

on:
  push:
    branches: ['arena/2544c5f9-color-coded-lyrics-cf-new']

permissions:
  contents: read
  issues: write   # chỉ để ĐĂNG kết quả lên PR #30 (log/artifact của runner bị chặn egress từ phiên này)

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_URL: https://chaereve.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Cài Playwright + Chromium
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Dựng bundle production
        run: npm run build

      - name: Smoke trên site thật (chỉ đọc, không đăng nhập)
        run: node tools/browserSmoke.mjs --live "$LIVE_URL" --out artifacts

      # Log và artifact của runner nằm trên results-receiver/blob.core.windows.net
      # — phiên Arena không ra được hai host đó (EOF), nên kết quả đi qua
      # ANNOTATION của check-run: API đọc được, và hiện đủ từng mục PASS/FAIL.
      - name: Xuất kết quả qua annotation
        if: always()
        run: |
          if [ ! -f artifacts/browser-smoke.json ]; then
            echo "::error::không có artifacts/browser-smoke.json — smoke chết trước mục kiểm đầu tiên"
            exit 0
          fi
          node -e '
            const d = require("./artifacts/browser-smoke.json");
            const bad = d.results.filter(r => !r.ok);
            console.log(`::notice::TỔNG: ${d.results.length - bad.length}/${d.results.length} mục đạt`);
            for (const r of d.results) {
              const line = `${r.ok ? "PASS" : "FAIL"} ${r.name}${r.extra ? " — " + String(r.extra) : ""}`.replace(/\r?\n/g, " ");
              console.log(`::notice::${line.slice(0, 1200)}`);
            }
          '

      - name: Lưu ảnh chụp + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-chaereve-pages-dev
          path: artifacts/
          if-no-files-found: warn
