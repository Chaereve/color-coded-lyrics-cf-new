# =========================================================
# DEPLOY MIGRATION 20261125 LÊN PRODUCTION — ĐÃ ĐƯỢC DUYỆT RIÊNG
# ---------------------------------------------------------
# File này TẠO RA SAU KHI chủ repo duyệt bằng văn bản (2026-10-08):
# "Duyệt chạy db:deploy migration 20261125 lên production DB".
# Nó áp ĐÚNG MỘT migration (20261125) qua guarded runner, với baseline
# 20261124 — runner tự kiểm lại trước khi ghi gì (fail-closed, một
# transaction mỗi migration, tự rollback khi lỗi).
#
# Cổng an toàn trong job này, theo đúng thứ tự:
#   1. db:check (tĩnh) — không có statement phá huỷ trong đường dẫn mặc định;
#   2. db:plan đọc-only — DỪNG nếu production không ở đúng trạng thái
#      "chỉ còn 20261125" (hoặc đã up-to-date thì bỏ qua deploy, idempotent);
#   3. db:deploy — chỉ chạy khi cổng 2 cho phép;
#   4. sau deploy: plan lại phải "up to date" + history có đúng 1 dòng 20261125;
#   5. db:check + npm test (Postgres ảo của runner — KHÔNG đụng production);
#   6. các query đối chiếu mục 6 docs/DB-MIGRATIONS.md — đọc-only, trong đó
#      Q4 chạy trong begin/rollback nên không ghi gì kể cả khi trigger thiếu,
#      Q5 gọi claim_daily_login từ phiên không đăng nhập — hàm phải fail-closed.
#
# KHÔNG có workflow_dispatch: deploy production không phải nút bấm. Push lên
# nhánh arena này chính là hành động đã duyệt; file này KHÔNG nên merge vào
# main (trên main chỉ nên có các job chỉ-đọc).
#
# Chuỗi kết nối lấy từ secret SUPABASE_DB_URL (Session pooler 5432) — không
# bao giờ in ra log, không bao giờ dán vào chat.
# =========================================================
name: DB deploy production — 20261125 (đã duyệt)

on:
  push:
    branches:
      - 'arena/c7f9fc9b-color-coded-lyrics-cf-new'

permissions:
  contents: read

concurrency:
  group: db-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Postgres ảo chỉ để chạy npm test — giống hệt job "DB migration safety".
    # Không có credential production nào ở đây.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      MIGRATION_DEPLOY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      SCHEMA_CHUNKS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DAILY_REWARDS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DAILY_QUIZ_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DAILY_SPIN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      COMMENTS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 1. db:check tĩnh — không cần DB, chặn trước khi đụng production.
      - name: db:check (tĩnh, không đụng DB)
        run: npm run db:check

      # 2. Cổng trước deploy: plan đọc-only. DỪNG nếu production lệch kỳ vọng.
      - name: Cổng trước deploy — plan đọc-only, chặn nếu không phải chỉ còn 20261125
        id: plangate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          npm run db:plan -- --baseline 20261124 2>&1 | tee /tmp/plan-pre.txt
          echo "--- kiểm tra pending ---"
          if grep -q 'up to date' /tmp/plan-pre.txt; then
            echo "ĐÃ UP-TO-DATE: 20261125 đã có trong production — không deploy lại (idempotent)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            N_APPLY=$(grep -c '^apply ' /tmp/plan-pre.txt || true)
            if [ "$N_APPLY" = "1" ] && grep -q '^apply 20261125 ' /tmp/plan-pre.txt; then
              echo "OK: chỉ còn đúng 20261125 — tiến hành deploy"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "FAIL: pending không phải chỉ mình 20261125 (số apply=$N_APPLY) — DỪNG, không deploy"
              exit 1
            fi
          fi

      # 3. DEPLOY — áp 20261125 lên production (đã được duyệt riêng).
      - name: db:deploy — áp 20261125 lên production (đã duyệt)
        if: steps.plangate.outputs.proceed == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          npm run db:deploy -- --baseline 20261124 2>&1 | tee /tmp/deploy.txt
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: db:deploy kết thúc với mã $RC — migration tự rollback, xem output trên" | tee -a /tmp/deploy.txt
            exit 1
          fi

      # 4. Xác nhận sau deploy: plan lại phải "up to date" + history có 20261125.
      - name: Xác nhận sau deploy — plan lại + lịch sử migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          npm run db:plan -- --baseline 20261124 2>&1 | tee /tmp/plan-post.txt
          grep -q 'up to date' /tmp/plan-post.txt || { echo "FAIL: vẫn còn migration pending sau deploy"; exit 1; }
          echo "OK: plan báo up to date"
          docker run --rm --network host \
            -e SUPABASE_DB_URL \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            postgres:17 \
            bash -c 'psql "$SUPABASE_DB_URL" -X -A -t -f scripts/verify-post-deploy-history.sql' \
            | tee /tmp/history.txt
          [ "$(head -1 /tmp/history.txt)" = "1" ] || { echo "FAIL: 20261125 chưa có trong history"; exit 1; }
          echo "OK: history có đúng 1 dòng 20261125 (tổng $(tail -1 /tmp/history.txt) migrations)"

      # 5a. db:check sau deploy (tĩnh).
      - name: db:check sau deploy
        run: npm run db:check

      # 5b. npm test đầy đủ trên Postgres ảo của runner.
      - name: npm test sau deploy (Postgres ảo — không đụng production)
        run: |
          set -uo pipefail
          npm test 2>&1 | tee /tmp/npm-test.txt
          RC=$?
          echo "--- tóm tắt TAP (npm test exit=$RC) ---" | tee /tmp/npm-test-summary.txt
          grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms)' /tmp/npm-test.txt | tee -a /tmp/npm-test-summary.txt || true
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: npm test kết thúc với mã $RC — xem /tmp/npm-test.txt" | tee -a /tmp/npm-test-summary.txt
            exit 1
          fi

      # 6a. Q0–Q3: đọc-only, ON_ERROR_STOP=1.
      - name: Đối chiếu mục 6 — Q0 đến Q3 (chỉ đọc)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e SUPABASE_DB_URL \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            postgres:17 \
            bash -c 'psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/verify-post-deploy.sql' \
            2>&1 | tee /tmp/verify6.txt

      # 6b. Q4: negative test trong begin/rollback — không ghi gì kể cả khi hỏng.
      - name: Đối chiếu mục 6 — Q4 (UPDATE đổi reward phải bị trigger từ chối)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          docker run --rm --network host \
            -e SUPABASE_DB_URL \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            postgres:17 \
            bash -c 'psql "$SUPABASE_DB_URL" -X -f scripts/verify-post-deploy-negative.sql' \
            > /tmp/q4.out 2> /tmp/q4.err
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "Q4 FAIL: psql không chạy được trên production (rc=$RC)" | tee /tmp/q4.verdict
            cat /tmp/q4.err | tee -a /tmp/q4.verdict
            exit 1
          fi
          LEGACY_ROWS=$(grep -E '^[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*$' /tmp/verify6.txt | tail -1 | awk -F'|' '{gsub(/[[:space:]]/,"",$3); print $3}')
          echo "legacy_rows (reward<>0) từ Q0b: ${LEGACY_ROWS:-?}"
          if grep -q 'err.dailyLoginRewardImmutable' /tmp/q4.err; then
            echo "Q4 PASS: UPDATE bị trigger từ chối bằng err.dailyLoginRewardImmutable — lịch sử không đổi" | tee /tmp/q4.verdict
            echo "--- stderr của psql ---" | tee -a /tmp/q4.verdict
            cat /tmp/q4.err | tee -a /tmp/q4.verdict
          elif [ "${LEGACY_ROWS:-1}" = "0" ]; then
            echo "Q4 PASS (vacuous): không có dòng reward<>0 nào để rewrite; trigger đã được chứng minh bằng Q3 (pg_trigger)" | tee /tmp/q4.verdict
          else
            echo "Q4 FAIL: có ${LEGACY_ROWS} dòng legacy mà UPDATE không bị chặn — DỪNG, điều tra ngay" | tee /tmp/q4.verdict
            cat /tmp/q4.err | tee -a /tmp/q4.verdict
            exit 1
          fi

      # 6c. Q5: claim từ phiên không đăng nhập phải fail-closed, không ghi gì.
      - name: Đối chiếu mục 6 — Q5 (claim_daily_login fail-closed, không ghi gì)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          docker run --rm --network host \
            -e SUPABASE_DB_URL \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            postgres:17 \
            bash -c 'psql "$SUPABASE_DB_URL" -X -f scripts/verify-post-deploy-claim.sql' \
            > /tmp/q5.out 2> /tmp/q5.err
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "Q5 FAIL: psql không chạy được trên production (rc=$RC)" | tee /tmp/q5.verdict
            cat /tmp/q5.err | tee -a /tmp/q5.verdict
            exit 1
          fi
          {
            echo "=== chi tiết Q5 ==="
            echo "--- stdout ---"; cat /tmp/q5.out
            echo "--- stderr (phải có err.signin) ---"; cat /tmp/q5.err
          } > /tmp/q5.detail
          if ! grep -q 'err.signin' /tmp/q5.err; then
            echo "Q5 FAIL: claim_daily_login không từ chối phiên NULL uid — kiểm tra lại function" | tee /tmp/q5.verdict
            cat /tmp/q5.detail | tee -a /tmp/q5.verdict
            exit 1
          fi
          BEFORE=$(grep -E '^[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*$' /tmp/q5.out | head -1 | tr -d ' ')
          AFTER=$(grep -E '^[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*$' /tmp/q5.out | tail -1 | tr -d ' ')
          if [ -z "$BEFORE" ] || [ -z "$AFTER" ]; then
            echo "Q5 FAIL: không đọc được số dòng TRƯỚC/SAU từ output" | tee /tmp/q5.verdict
            cat /tmp/q5.detail | tee -a /tmp/q5.verdict
            exit 1
          fi
          B1=${BEFORE%%|*}; A1=${AFTER%%|*}
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Q5 PASS: claim từ phiên không đăng nhập bị từ chối (err.signin) và không ghi gì — số dòng không đổi ($BEFORE)" | tee /tmp/q5.verdict
          elif [ "$A1" -gt "$B1" ]; then
            echo "Q5 PASS (có lưu ý): claim từ runner bị từ chối (err.signin), không ghi gì; số dòng tăng $BEFORE -> $AFTER do người dùng thật điểm danh đồng thời (production đang live)" | tee /tmp/q5.verdict
          else
            echo "Q5 FAIL: số dòng GIẢM $BEFORE -> $AFTER — lịch sử bị xoá?! DỪNG, điều tra ngay" | tee /tmp/q5.verdict
            cat /tmp/q5.detail | tee -a /tmp/q5.verdict
            exit 1
          fi
          cat /tmp/q5.detail >> /tmp/q5.verdict

      # Kênh đọc kết quả từ sandbox: log/artifact của runner không tải được (host
      # lưu trữ ngoài allowlist) → tóm tắt toàn bộ kết quả ra annotation.
      # Không output nào trong các file này chứa chuỗi kết nối.
      - name: Xuất kết quả deploy ra annotation
        if: always()
        run: |
          node -e '
          const fs = require("fs")
          const read = p => { try { return fs.readFileSync(p, "utf8").trim() } catch { return "(không có file: " + p + ")" } }
          const msg = s => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A")
          const title = s => msg(s).replace(/:/g, "%3A").replace(/,/g, "%2C")
          const emit = (t, body) => console.log(`::notice title=${title(t)}::${msg(body)}`)
          emit("deploy 20261125 — cổng plan + kết quả deploy", read("/tmp/plan-pre.txt") + "\n\n" + read("/tmp/deploy.txt"))
          emit("xác nhận sau deploy — plan lại + history", read("/tmp/plan-post.txt") + "\n\n" + read("/tmp/history.txt"))
          emit("đối chiếu mục 6 — Q0 đến Q3 (chỉ đọc)", read("/tmp/verify6.txt"))
          emit("đối chiếu mục 6 — Q4 negative test", read("/tmp/q4.verdict"))
          emit("đối chiếu mục 6 — Q5 claim test", read("/tmp/q5.verdict"))
          emit("db:check + npm test sau deploy", read("/tmp/npm-test-summary.txt"))
          '

      - name: Lưu toàn bộ output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-deploy-production-20261125
          path: |
            /tmp/plan-pre.txt
            /tmp/deploy.txt
            /tmp/plan-post.txt
            /tmp/history.txt
            /tmp/verify6.txt
            /tmp/q4.out
            /tmp/q4.err
            /tmp/q4.verdict
            /tmp/q5.out
            /tmp/q5.err
            /tmp/q5.verdict
            /tmp/npm-test.txt
          if-no-files-found: warn
