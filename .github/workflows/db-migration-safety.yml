# Deployment-safety guard for the database layer.
#
# This workflow applies NOTHING to any real environment: the project has no
# automated migration deployment, so the risk it guards against is (a) a
# destructive statement reaching the default execution path — the thing 20261118
# did — and (b) a baseline being recorded for a database that does not actually
# have the schema it claims. See docs/DB-MIGRATIONS.md.
name: DB migration safety

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  guard:
    runs-on: ubuntu-latest
    # A throwaway database so the migration/baseline suites really run instead
    # of self-skipping. It is created by the runner and dropped by the tests;
    # no credentials of any real environment are involved.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      MIGRATION_DEPLOY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      SCHEMA_CHUNKS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DAILY_REWARDS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DAILY_QUIZ_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DAILY_SPIN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      COMMENTS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fails if any migration, schema.sql or setup chunk rewrites check-in
      # history, or if the quarantine manifest is inconsistent.
      - name: No destructive statement in the default migration path
        run: npm run db:check

      # The fresh-install chunks must still be a byte-exact split of schema.sql.
      - name: Setup chunks match schema.sql
        run: npm run schema:split:check

      # Full suite against the throwaway Postgres service: deployment modes,
      # baseline readiness, quarantine, fresh install, quiz/spin/comments.
      - name: Tests (including the real-PostgreSQL migration and baseline suites)
        run: |
          set +e
          npm test 2>&1 | tee /tmp/npm-test.txt
          code=${PIPESTATUS[0]}
          node -e '
            const fs = require("fs")
            const t = fs.readFileSync("/tmp/npm-test.txt", "utf8")
            const fails = t.split(/\n/).filter(l => /^not ok /.test(l) || /^# fail /.test(l)).slice(0, 40)
            const msg = s => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A")
            if (fails.length) console.log(`::error title=npm test::${msg(fails.join("\n"))}`)
          '
          exit $code

      # Cùng file migration, nhưng trên engine thứ hai (PostgreSQL WASM trong
      # PGlite): suite này không tự skip khi thiếu service, nên nó vẫn kiểm tra
      # tiền kiểm/hậu kiểm và rollback ngay cả khi Postgres bên trên lỗi.
      - name: Daily free votes on PGlite (second engine, no service needed)
        run: npm run test:free-votes:pglite

      # Chuỗi thưởng B1 (ledger + cap + check-in + achievements v2) trên cùng
      # engine thứ hai: không cần service, không tự skip khi thiếu URL.
      - name: Reward ledger & login rewards on PGlite (B1 chain)
        run: npm run test:ledger:pglite

      # Mystery box B2 (20261129) trên cùng chuỗi migration đã có ở trên.
      - name: Mystery box on PGlite (B2 chain)
        run: npm run test:mystery:pglite

      # Daily Spin v2 (20261201): 7 ô trọng số 30/25/20/12/8/4/1 + luật
      # không-lặp trên cùng chuỗi migration đã có ở trên.
      - name: Daily Spin v2 on PGlite (B3 chain)
        run: npm run test:spinv2:pglite

      # Bảng bằng chứng đọc được cho câu hỏi của gate review: một bundle cũ còn
      # trong cache gọi lại 5 RPC đã revoke thì nhận gì, và người dùng thấy gì.
      # Chạy trên chính database throwaway ở trên, không đụng môi trường thật.
      - name: Old client meets the revoked RPCs (a–d evidence table)
        run: node tools/revoked-rpc-evidence.mjs

      - name: Lưu bảng bằng chứng
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revoked-rpc-client-view
          path: artifacts/revoked-rpc-client-view.json
          if-no-files-found: warn

      - name: Lint
        run: npm run lint
